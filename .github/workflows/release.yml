name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (host arm64 native deps)
        run: npm ci

      - name: Install x64 darwin native deps alongside arm64
        run: npm install --no-save --cpu=x64 --os=darwin --include=optional

      - name: Build and publish
        run: npm run release -w @antidraw/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
