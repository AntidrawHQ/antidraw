appId: com.antidraw.app
productName: Antidraw
directories:
  buildResources: build
  output: release/${version}
files:
  - dist/**
  - package.json
  - '!**/*.{ts,tsx,map}'
  - '!**/{tsconfig*.json,vitest.config.*,electron.vite.config.*}'
  - '!src/**'
  - '!**/{.eslintrc*,.prettier*,.editorconfig,.gitignore,README.md,CHANGELOG.md}'
asarUnpack:
  - node_modules/@libsql/**
  - node_modules/npm/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - resources/**
mac:
  category: public.app-category.developer-tools
  # Icon Composer bundle: macOS 26 draws it natively; the Assets.car it compiles
  # to also carries pre-rounded renditions for macOS 11-15.
  icon: build/icon.icon
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  title: Antidraw
  artifactName: ${productName}-${version}-${arch}.${ext}
  background: build/dmg-bg.png
  # The volume icon only reads .icns, so point it at the pre-rounded one rather
  # than the 256px fallback electron-builder derives from icon.icon.
  icon: build/icon.icns
  window:
    width: 540
    height: 380
  iconSize: 96
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
publish:
  provider: github
  owner: AntidrawHQ
  repo: antidraw
  releaseType: draft
